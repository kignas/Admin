<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Nearbite Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 20px;
      background: #f7f7f7;
      color: #222;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 25px;
    }

    .warning {
      background: #fff3cd;
      border: 1px solid #ffe08a;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #d6334c;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 7px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .ok {
      display: block !important;
      background: #e8f7ed;
      color: #176b35;
    }

    .err {
      display: block !important;
      background: #fdecea;
      color: #9c1c14;
    }
  </style>
</head>

<body>

  <h1>⚠️ One-time Nearbite Admin Creation</h1>

  <div class="warning">
    Create the new admin account here.
    <br><br>
    <strong>Delete this page after successfully creating the admin.</strong>
  </div>

  <label for="baseUrl">Backend URL</label>
  <input
    id="baseUrl"
    value="https://eatswada.onrender.com"
    autocomplete="off"
  >

  <label for="setupKey">Setup Key</label>
  <input
    id="setupKey"
    type="password"
    placeholder="ADMIN_SETUP_KEY from Render"
    autocomplete="off"
  >

  <label for="name">Admin Name</label>
  <input
    id="name"
    type="text"
    placeholder="Your admin name"
    autocomplete="name"
  >

  <label for="email">Admin Email</label>
  <input
    id="email"
    type="email"
    placeholder="admin@example.com"
    autocomplete="email"
  >

  <label for="phone">Admin Phone</label>
  <input
    id="phone"
    type="tel"
    placeholder="+91XXXXXXXXXX"
    autocomplete="tel"
  >

  <label for="password">New Admin Password</label>
  <input
    id="password"
    type="password"
    placeholder="Minimum 6 characters"
    autocomplete="new-password"
  >

  <button id="createBtn" onclick="createAdmin()">
    Create Admin Account
  </button>

  <div id="result"></div>

<script>

async function createAdmin() {

  const resultBox = document.getElementById("result");
  const button = document.getElementById("createBtn");

  resultBox.className = "";
  resultBox.style.display = "none";

  const baseUrl =
    document.getElementById("baseUrl").value
      .trim()
      .replace(/\/$/, "");

  const setupKey =
    document.getElementById("setupKey").value.trim();

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const password =
    document.getElementById("password").value;

  if (!baseUrl || !setupKey || !name || !email || !phone || !password) {

    resultBox.textContent =
      "❌ Please fill in all fields.";

    resultBox.className = "err";
    return;
  }

  if (password.length < 6) {

    resultBox.textContent =
      "❌ Password must be at least 6 characters.";

    resultBox.className = "err";
    return;
  }

  button.disabled = true;
  button.textContent = "Creating Admin...";

  try {

    const response = await fetch(
      `${baseUrl}/api/auth/setup-admin`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "x-setup-key": setupKey
        },

        body: JSON.stringify({
          name,
          email,
          phone,
          password
        })
      }
    );

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch (error) {

      resultBox.textContent =
        `❌ HTTP ${response.status}\n\n${text}`;

      resultBox.className = "err";
      return;
    }

    if (response.ok && data.success) {

      resultBox.textContent =
`✅ ADMIN ACCOUNT CREATED SUCCESSFULLY

Name: ${data.admin.name}
Email: ${data.admin.email}
Phone: ${data.admin.phone}
Role: ${data.admin.role}

You can now go to the normal Admin Login page.

IMPORTANT:
Delete setup-admin.html after this.`;

      resultBox.className = "ok";

    } else {

      resultBox.textContent =
`❌ HTTP ${response.status}

${data.message || "Admin creation failed."}`;

      resultBox.className = "err";
    }

  } catch (error) {

    resultBox.textContent =
`❌ Network Error

${error.message}`;

    resultBox.className = "err";

  } finally {

    button.disabled = false;
    button.textContent = "Create Admin Account";
  }
}

</script>

</body>
</html>
