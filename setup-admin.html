<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nearbite — One-Time Admin Password Reset</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.2rem; }
  label { display: block; margin-top: 14px; font-size: 0.9rem; font-weight: 600; }
  input { width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
  button { margin-top: 20px; width: 100%; padding: 12px; background: #d63447; color: #fff; border: none; border-radius: 6px; font-size: 1rem; }
  #result { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 0.9rem; display: none; white-space: pre-wrap; }
  .ok { background: #e6f7ec; color: #14663d; display: block; }
  .err { background: #fdecea; color: #9c1c14; display: block; }
</style>
</head>
<body>
  <h1>⚠️ One-time admin password reset — delete this page after use</h1>

  <label>Backend URL</label>
  <input id="baseUrl" placeholder="https://your-backend.onrender.com">

  <label>Setup key</label>
  <input id="setupKey" placeholder="Same value as ADMIN_SETUP_KEY on Render">

  <label>New Password</label>
  <input id="password" type="password" placeholder="Strong new password">

  <button onclick="resetPassword()">Reset Admin Password</button>

  <div id="result"></div>

<script>
async function resetPassword() {
  const resultBox = document.getElementById('result');
  resultBox.className = '';
  resultBox.style.display = 'none';

  const baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
  const setupKey = document.getElementById('setupKey').value.trim();
  const password = document.getElementById('password').value;

  if (!baseUrl || !setupKey || !password) {
    resultBox.textContent = 'Please fill in backend URL, setup key, and new password.';
    resultBox.className = 'err';
    return;
  }

  try {
  const res = await fetch(`${baseUrl}/api/setup/reset-admin-password`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-setup-key': setupKey,
    },
    body: JSON.stringify({ password }),
  });

  const responseText = await res.text();

  let data;
  try {
    data = JSON.parse(responseText);
  } catch {
    resultBox.textContent =
      `❌ HTTP ${res.status}\n\nRaw Response:\n${responseText}`;
    resultBox.className = 'err';
    resultBox.style.display = 'block';
    return;
  }

  if (res.ok && data.success) {
    resultBox.textContent =
      `✅ ${data.message}

Name: ${data.admin?.name || "-"}
Email: ${data.admin?.email || "-"}
Phone: ${data.admin?.phone || "-"}`;
    resultBox.className = 'ok';
  } else {
    resultBox.textContent =
      `❌ HTTP ${res.status}

${data.message || "Unknown error"}

Full Response:
${JSON.stringify(data, null, 2)}`;
    resultBox.className = 'err';
  }

} catch (err) {
  resultBox.textContent =
    `❌ Network Error

${err.message}`;
  resultBox.className = 'err';
}

resultBox.style.display = 'block';
}
</script>
</body>
</html>
