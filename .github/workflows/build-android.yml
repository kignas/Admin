      - name: Configure Firebase for Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON"
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'android/app/build.gradle';
          let content = fs.readFileSync(path, 'utf8');

          if (!content.includes('com.google.gms.google-services')) {
            if (!/plugins\s*\{/.test(content)) {
              throw new Error('Android Gradle plugins block not found');
            }
            content = content.replace(
              /plugins\s*\{/,
              "plugins {\n    id 'com.google.gms.google-services' version '4.4.4'"
            );
            fs.writeFileSync(path, content);
          }

          const config = JSON.parse(
            fs.readFileSync('android/app/google-services.json', 'utf8')
          );
          const packages = (config.client || []).map(
            client => client.client_info?.android_client_info?.package_name
          );

          if (!packages.includes('com.eatswada.admin')) {
            throw new Error('Admin Firebase package name is missing');
          }

          console.log('Admin Firebase configuration validated.');
          NODE
